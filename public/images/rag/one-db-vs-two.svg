<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Architecture comparison: a dedicated vector database next to Postgres versus pgvector inside Postgres">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#EEEEE1"/>
    </marker>
    <marker id="arrSync" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fca5a5"/>
    </marker>
  </defs>

  <rect width="640" height="330" rx="12" fill="#171717"/>
  <text x="320" y="34" text-anchor="middle" fill="#EEEEE1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">Two architectures, same feature</text>

  <!-- divider -->
  <line x1="320" y1="56" x2="320" y2="306" stroke="#EEEEE1" stroke-opacity="0.15" stroke-dasharray="3 5"/>
  <circle cx="320" cy="180" r="13" fill="#262626" stroke="#EEEEE1" stroke-opacity="0.3"/>
  <text x="320" y="184" text-anchor="middle" fill="#EEEEE1" opacity="0.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">vs</text>

  <!-- ============ LEFT: dedicated vector DB ============ -->
  <text x="162" y="74" text-anchor="middle" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.5">DEDICATED VECTOR DB</text>

  <rect x="102" y="92" width="120" height="34" rx="6" fill="#262626" stroke="#EEEEE1" stroke-opacity="0.5"/>
  <text x="162" y="113" text-anchor="middle" fill="#EEEEE1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Your app</text>

  <line x1="135" y1="126" x2="100" y2="190" stroke="#EEEEE1" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <line x1="189" y1="126" x2="232" y2="190" stroke="#EEEEE1" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <text x="98" y="158" text-anchor="middle" fill="#93c5fd" opacity="0.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5">docs</text>
  <text x="240" y="158" text-anchor="middle" fill="#f9a8d4" opacity="0.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5">vectors</text>

  <rect x="25" y="192" width="120" height="52" rx="6" fill="#1c1c1c" stroke="#93c5fd"/>
  <text x="85" y="214" text-anchor="middle" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">PostgreSQL</text>
  <text x="85" y="231" text-anchor="middle" fill="#EEEEE1" opacity="0.55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">documents</text>

  <rect x="179" y="192" width="120" height="52" rx="6" fill="#1c1c1c" stroke="#f9a8d4"/>
  <text x="239" y="214" text-anchor="middle" fill="#f9a8d4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">Vector DB</text>
  <text x="239" y="231" text-anchor="middle" fill="#EEEEE1" opacity="0.55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">embeddings</text>

  <!-- sync pipeline -->
  <path d="M85,244 V254 H239 V244" fill="none" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="4 4" marker-start="url(#arrSync)" marker-end="url(#arrSync)"/>
  <text x="162" y="272" text-anchor="middle" fill="#fca5a5" opacity="0.85" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">sync pipeline</text>

  <text x="162" y="302" text-anchor="middle" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">two deployments · two credentials · sync bugs</text>

  <!-- ============ RIGHT: Postgres + pgvector ============ -->
  <text x="477" y="74" text-anchor="middle" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.5">POSTGRESQL + PGVECTOR</text>

  <rect x="417" y="92" width="120" height="34" rx="6" fill="#262626" stroke="#EEEEE1" stroke-opacity="0.5"/>
  <text x="477" y="113" text-anchor="middle" fill="#EEEEE1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Your app</text>

  <line x1="477" y1="126" x2="477" y2="188" stroke="#EEEEE1" stroke-opacity="0.6" marker-end="url(#arr)"/>
  <text x="492" y="160" fill="#EEEEE1" opacity="0.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5">one SQL query</text>

  <rect x="372" y="190" width="210" height="74" rx="6" fill="#1c1c1c" stroke="#86efac"/>
  <text x="477" y="211" text-anchor="middle" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">PostgreSQL + pgvector</text>

  <rect x="384" y="222" width="88" height="30" rx="4" fill="#262626" stroke="#EEEEE1" stroke-opacity="0.3"/>
  <text x="428" y="241" text-anchor="middle" fill="#EEEEE1" opacity="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">documents</text>

  <rect x="482" y="222" width="88" height="30" rx="4" fill="#262626" stroke="#EEEEE1" stroke-opacity="0.3"/>
  <text x="526" y="241" text-anchor="middle" fill="#EEEEE1" opacity="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">vector(1536)</text>

  <text x="477" y="302" text-anchor="middle" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">one query · one transaction · one deployment</text>
</svg>
